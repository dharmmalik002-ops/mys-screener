    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%23e6c88c'/%3E%3Cstop offset='100%25' stop-color='%23a67c34'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-style='italic' font-weight='400' font-size='19' fill='%2317130a' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <script>
      (function () {
        var perf = typeof window !== "undefined" ? window.performance : null;
        if (!perf) {
          return;
        }

        var noop = function () {};
        var patchMethod = function (name) {
          if (typeof perf[name] === "function") {
            return;
          }
          try {
            Object.defineProperty(perf, name, {
              configurable: true,
              writable: true,
              value: noop,
            });
          } catch (_error) {
            try {
              perf[name] = noop;
            } catch (_ignored) {}
          }
        };

        patchMethod("clearMarks");
        patchMethod("clearMeasures");
      })();
    </script>
    <title>Mr. Malik Scanner</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
