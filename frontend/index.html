<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Mr. Malik Scanner — Professional NSE/BSE stock screener with real-time data, sector heatmaps, and technical analysis." />
    <meta name="theme-color" content="#f8f8f8" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Scanner" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <script>
      // Apply the saved theme before first paint so the page never flashes
      // the other palette while React boots. Mirrors readTheme() in App.tsx.
      (function () {
        var root = document.documentElement;
        var theme = "light";
        var design = "studio";
        try {
          theme = window.localStorage.getItem("mr-malik-theme:v2") === "dark" ? "dark" : "light";
          design = window.localStorage.getItem("mr-malik-design:v1") === "classic" ? "classic" : "studio";
        } catch (_error) {}
        root.dataset.theme = theme;
        root.dataset.design = design;
        // Classic is set in Geist + Instrument Serif; Studio uses the system
        // face and needs no web fonts, so only Classic pays for the download.
        if (design === "classic") {
          var link = document.createElement("link");
          link.rel = "stylesheet";
          link.href = "https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&family=Instrument+Serif:ital@0;1&display=swap";
          document.head.appendChild(link);
        }
      })();
    </script>
    <script>
      (function () {
        var perf = typeof window !== "undefined" ? window.performance : null;
        if (!perf) {
          return;
        }

        var noop = function () {};
        var patchMethod = function (name) {
          if (typeof perf[name] === "function") {
            return;
          }
          try {
            Object.defineProperty(perf, name, {
              configurable: true,
              writable: true,
              value: noop,
            });
          } catch (_error) {
            try {
              perf[name] = noop;
            } catch (_ignored) {}
          }
        };

        patchMethod("clearMarks");
        patchMethod("clearMeasures");
      })();
    </script>
    <title>Mr. Malik Scanner</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
