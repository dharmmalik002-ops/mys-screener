name: Keep HuggingFace Backend Warm

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/keep-alive.yml"
  schedule:
    # Every 5 minutes
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  ping-backend:
    name: Ping HF health endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Hit /api/health
        run: |
          echo "Pinging HuggingFace backend health endpoint..."
          HTTP_CODE=$(curl -L -s -o /tmp/health.json -w "%{http_code}" --max-time 120 \
            "https://dharmmalik-stock-scanner-backend.hf.space/api/health")
          echo "HTTP status: $HTTP_CODE"
          echo "Response:"
          cat /tmp/health.json || true

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Keep-alive ping failed with HTTP $HTTP_CODE"
            exit 1
          fi

          echo "Backend is awake."

      # Self-healing: GitHub's scheduled cron is best-effort and has been delaying/
      # dropping the daily-bhavcopy runs. Keep-alive fires every 5 min reliably, so
      # we use it as a watchdog — if today's bhavcopy patch is still missing past
      # 4:30 PM IST on a weekday, fire the bhavcopy workflow via workflow_dispatch.
      # The bhavcopy job's own "Log skip" step makes redundant invocations cheap.
      - name: Watchdog — dispatch bhavcopy if today's patch is missing
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          IST_DOW=$(TZ='Asia/Kolkata' date +%u)        # 1=Mon … 7=Sun
          IST_HOUR=$(TZ='Asia/Kolkata' date +%H)
          IST_MIN=$(TZ='Asia/Kolkata' date +%M)
          IST_DATE=$(TZ='Asia/Kolkata' date +%F)        # YYYY-MM-DD
          echo "IST now: ${IST_DATE} ${IST_HOUR}:${IST_MIN} (dow=${IST_DOW})"

          # Weekend → no bhavcopy expected.
          if [ "$IST_DOW" -gt 5 ]; then
            echo "Weekend in IST — skipping."
            exit 0
          fi

          # Active window: 16:20 IST → 23:55 IST. Wide on purpose: GitHub
          # throttles this repo's schedules so badly that keep-alive often
          # ticks only every 2-5 HOURS — a narrow window can miss the whole
          # evening (2026-06-12: zero ticks landed between 16:30 and 22:00).
          if [ "$IST_HOUR" -lt 16 ]; then
            echo "Too early — skipping."
            exit 0
          fi
          if [ "$IST_HOUR" -eq 16 ] && [ "$IST_MIN" -lt 20 ]; then
            echo "Too early (before 16:20 IST) — skipping."
            exit 0
          fi

          PATCH_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/backend/data/bhavcopy_patch.json"
          PATCH_DATE=$(curl -s -L --max-time 30 "$PATCH_URL" \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('date',''))" 2>/dev/null || echo "")
          echo "Current bhavcopy patch date: ${PATCH_DATE:-<unknown>}"

          if [ "$PATCH_DATE" = "$IST_DATE" ]; then
            echo "Bhavcopy already current for ${IST_DATE} — nothing to do."
            exit 0
          fi

          echo "Bhavcopy stale (last=${PATCH_DATE}, today=${IST_DATE}). Dispatching daily-bhavcopy.yml…"
          HTTP_CODE=$(curl -s -o /tmp/dispatch.json -w "%{http_code}" -X POST \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/daily-bhavcopy.yml/dispatches" \
            -d '{"ref":"main"}')
          echo "Dispatch HTTP: ${HTTP_CODE}"
          cat /tmp/dispatch.json || true
          if [ "$HTTP_CODE" != "204" ]; then
            echo "WARN: dispatch returned ${HTTP_CODE} (expected 204). Will retry on next keep-alive tick."
          fi
