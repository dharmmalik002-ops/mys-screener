name: Breakout follow-through stats

# Replays every scanner over daily bars and measures what happened after each
# signal. Feeds the Markets page exposure verdict and regime brief.
#
# Bars: the replay was written against backend/data/chart_cache/, which is
# gitignored, so on a runner it did not exist and this job failed on its first
# file read every night from the day it was added — the committed stats were
# the one hand-built file from 2026-08-10. scripts/build_breakout_bars.py now
# builds the bars here first: chunked yf.download (the call shape that works
# from datacenter IPs), gap-filled from the committed data/eod_bars store.
#
# Reaching the HF Space: a push made with GITHUB_TOKEN never triggers another
# workflow, so deploy.yml does NOT fire for this commit. The Space pulls the
# file from the public repo itself (main.py::pull_latest_breakout_stats, run on
# startup and from the traffic self-heal), the same way it gets XP breadth and
# the EOD bars.
#
# Cost: ~13 min of downloads plus ~35 min of CPU for a 12-week window over
# ~1,500 symbols, which is why this is a nightly job rather than an endpoint.

on:
  schedule:
    - cron: "30 14 * * 1-5" # 8:00 PM IST, well after the bhavcopy retries finish
  workflow_dispatch:
    inputs:
      weeks:
        description: "How many ISO weeks back to replay"
        required: false
        default: "12"

permissions:
  contents: write

concurrency:
  # Never let two replays race to write the same file.
  group: breakout-stats
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Build daily bars
        run: |
          set -euo pipefail
          cd backend
          python3 scripts/build_breakout_bars.py

      - name: Replay scanners and build stats
        run: |
          set -euo pipefail
          cd backend
          python3 scripts/generate_breakout_stats.py \
            --weeks "${{ github.event.inputs.weeks || '12' }}" \
            --bars-dir data/breakout_bars

      - name: Sanity-check the output
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys
          from pathlib import Path

          path = Path("backend/data/breakout_stats.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          weeks = data.get("weeks") or []

          # A run that produced no weeks, or no signals, means the replay silently
          # failed (missing chart cache, universe drift). Committing that would
          # blank the Markets page, so fail loudly instead.
          if not weeks:
              sys.exit("no weeks produced — refusing to commit an empty stats file")
          if not data.get("signals"):
              sys.exit("no signals produced — refusing to commit an empty stats file")

          resolved = sum(int((w.get("overall") or {}).get("resolved") or 0) for w in weeks)
          if resolved == 0:
              sys.exit("no signal resolved in any week — simulation produced nothing usable")

          print(f"{len(weeks)} weeks, {data['signals']} signals, {resolved} resolved")
          print(f"as_of={data.get('as_of_session')} symbols={data.get('symbols_replayed')}")
          PY

      - name: Commit stats
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/data/breakout_stats.json
          if git diff --cached --quiet; then
            echo "Stats unchanged — nothing to commit."
            exit 0
          fi
          AS_OF=$(python3 -c "import json; print(json.load(open('backend/data/breakout_stats.json'))['as_of_session'])")
          SIGS=$(python3 -c "import json; print(json.load(open('backend/data/breakout_stats.json'))['signals'])")
          # The Space pulls this file itself (see the header); a GITHUB_TOKEN
          # push would not trigger deploy.yml anyway.
          git commit -m "data: breakout follow-through stats through ${AS_OF} (${SIGS} signals)"
          # Same race-proofing as the bhavcopy job: feature commits land on main
          # while this long job runs, so a plain push is rejected with
          # "fetch first". Rebase onto the moved main and retry once.
          if ! git push origin HEAD:main; then
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
