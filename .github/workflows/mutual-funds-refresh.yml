name: Mutual Fund Universe Refresh

on:
  # AMFI publishes NAVs by ~11 PM IST, so a run after midnight IST picks up the
  # previous session cleanly. Off-peak minute for the same reason as
  # daily-bhavcopy.yml: Actions drops scheduled runs landing on :00/:15/:30/:45.
  schedule:
    - cron: "37 19 * * 1-5"   # 1:07 AM IST, Tue-Sat (covers Mon-Fri sessions)
    - cron: "41 21 * * 1-5"   # 3:11 AM IST (retry if the first was dropped)
  push:
    branches: [main]
    paths:
      - ".github/workflows/mutual-funds-refresh.yml"
      - "backend/scripts/build_mf_universe.py"
      - "backend/scripts/build_sector_indices.py"
      - "backend/app/services/mutual_funds/**"
  workflow_dispatch:
    inputs:
      full_crawl:
        description: "Re-crawl every fund page (slow, ~10 min). Leave off to refresh NAVs and ranks only."
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # A second run crawling the same 1,600 pages while the first is mid-flight
  # gains nothing and doubles the load on the source.
  group: mutual-funds-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Rebuild mf_universe.json
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests yfinance pandas

      # The reference rows and holdings blobs come from crawling ~1,600 fund
      # pages, and they only change when AMCs file their monthly portfolio
      # disclosures. Caching them weekly means the daily run re-fetches NAV
      # (which does change daily) and skips the crawl. Both paths are
      # gitignored, so without this cache every run would be a full crawl.
      - name: Restore crawled reference data
        id: refcache
        uses: actions/cache@v4
        with:
          path: |
            backend/data/mf_reference.json
            backend/data/mf_details
          # Keyed on the crawler's own source. Without this, a fix to the
          # crawl reuses a reference set produced by the *old* code and the fix
          # never reaches production until the weekly re-crawl — which is
          # exactly what happened when the Direct/Growth slug filter was
          # corrected: the nightly run picked up the new benchmark mapping but
          # kept the stale 1,588-slug crawl, leaving 49 funds still missing.
          key: mf-reference-${{ hashFiles('backend/app/services/mutual_funds/groww_source.py', 'backend/app/services/mutual_funds/harvest.py', 'backend/scripts/build_mf_universe.py') }}-${{ github.run_id }}
          restore-keys: |
            mf-reference-${{ hashFiles('backend/app/services/mutual_funds/groww_source.py', 'backend/app/services/mutual_funds/harvest.py', 'backend/scripts/build_mf_universe.py') }}-

      - name: Decide crawl mode
        id: mode
        # Re-crawl weekly (or on request, or when the cache is cold) so monthly
        # holdings disclosures and expense-ratio changes get picked up; refresh
        # NAV and recompute ranks on every other run.
        run: |
          set -euo pipefail
          week_day="$(date -u +%u)"
          if [ "${{ github.event.inputs.full_crawl }}" = "true" ] \
             || [ ! -f backend/data/mf_reference.json ] \
             || [ "$week_day" = "6" ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build universe
        id: build
        run: |
          set -euo pipefail
          if [ "${{ steps.mode.outputs.full }}" = "true" ]; then
            echo "full crawl: re-reading every fund page"
            python backend/scripts/build_mf_universe.py --workers 6 --nav-workers 10 --refresh-navs
          else
            echo "refreshing NAV history and recomputing ranks from cached reference rows"
            python backend/scripts/build_mf_universe.py --compute-only --refresh-navs
          fi

          # Sector index history ships with the app because Yahoo refuses most
          # of these symbols from datacenter IPs — see
          # scripts/build_sector_indices.py. The builder keeps whatever it
          # already has when a fetch fails and refuses to shrink the file, so a
          # throttled runner cannot take the Sectors page down; a non-zero exit
          # here must not fail the universe refresh either.
          python backend/scripts/build_sector_indices.py || \
            echo "sector index refresh failed; keeping the committed history" >&2

          if git diff --quiet backend/data/mf_universe.json backend/data/sector_indices.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sanity-check the universe before committing
        if: steps.build.outputs.changed == 'true'
        # A bad crawl (source markup change, blocked runner) would otherwise
        # commit a near-empty file and take the Funds page down until someone
        # noticed. Refuse anything that looks like a partial build.
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, sys
          from pathlib import Path

          payload = json.loads(Path("backend/data/mf_universe.json").read_text())
          funds = payload.get("funds") or []
          count = len(funds)
          with_3y = sum(1 for row in funds if isinstance(row.get("return_3y"), (int, float)))
          categories = len(payload.get("categories") or {})

          print(f"funds={count} with_3y={with_3y} categories={categories} as_of={payload.get('as_of')}")

          problems = []
          if count < 800:
              problems.append(f"only {count} funds (expected 1,000+)")
          if with_3y < 400:
              problems.append(f"only {with_3y} funds have a 3-year return")
          if categories < 12:
              problems.append(f"only {categories} categories")
          if not payload.get("as_of"):
              problems.append("no as_of date")
          if problems:
              print("REFUSING TO COMMIT: " + "; ".join(problems), file=sys.stderr)
              sys.exit(1)
          PY

      - name: Commit and push if updated
        if: steps.build.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add backend/data/mf_universe.json backend/data/sector_indices.json
          git commit -m "chore(funds): refresh mutual fund universe [skip ci]" || exit 0
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            echo "push attempt ${attempt} failed, retrying" >&2
            sleep 5
          done
          exit 1
