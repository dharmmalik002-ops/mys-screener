name: Frontend checks

# Type-check, unit tests and a production build for every change to the
# frontend. Vercel deploys whatever lands on main, so this is the only thing
# between a broken commit and the live site. Read-only: it never deploys.
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-checks.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-checks.yml"
  workflow_dispatch: {}

concurrency:
  group: frontend-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Type-check, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npx --no-install tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
