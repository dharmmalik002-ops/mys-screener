name: Daily NSE Bhavcopy Patch

on:
  # NSE often publishes the official CM Bhavcopy sometime between ~5:30–6:30 PM IST.
  # Check repeatedly through that window so the site updates much closer to publication time.
  # NOTE: NSE archives geo-block non-Indian IPs (GitHub Actions servers are outside India).
  #       The script now falls back to yfinance (Yahoo Finance) which is globally accessible.
  schedule:
    - cron: "10 12 * * 1-5"  # 5:40 PM IST
    - cron: "25 12 * * 1-5"  # 5:55 PM IST
    - cron: "40 12 * * 1-5"  # 6:10 PM IST
    - cron: "55 12 * * 1-5"  # 6:25 PM IST
    - cron: "10 13 * * 1-5"  # 6:40 PM IST
    - cron: "25 13 * * 1-5"  # 6:55 PM IST
    - cron: "00 14 * * 1-5"  # 7:30 PM IST final retry
  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:

jobs:
  bhavcopy:
    name: Fetch NSE EOD prices and commit patch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests yfinance pandas

      - name: Generate bhavcopy patch
        id: patch
        run: |
          set -euo pipefail
          python backend/scripts/generate_bhavcopy_patch.py
          # Capture whether the file changed (new date vs already current)
          if git diff --quiet backend/data/bhavcopy_patch.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push if updated
        if: steps.patch.outputs.changed == 'true'
        run: |
          set -euo pipefail
          retry() {
            local attempts="$1"
            shift
            local try=1
            until "$@"; do
              if [ "$try" -ge "$attempts" ]; then
                echo "command failed after ${try} attempts: $*" >&2
                return 1
              fi
              echo "retry ${try}/${attempts} failed: $*" >&2
              try=$((try + 1))
              sleep 5
            done
          }
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          DATE=$(python3 -c "import json; d=json.load(open('backend/data/bhavcopy_patch.json')); print(d['date'])")
          SOURCE=$(python3 -c "import json; d=json.load(open('backend/data/bhavcopy_patch.json')); print(str(d.get('source','NSE')).upper())")
          SYMS=$(python3 -c "import json; d=json.load(open('backend/data/bhavcopy_patch.json')); print(len(d['symbols']))")
          git add backend/data/bhavcopy_patch.json
          git commit -m "data: ${SOURCE} EOD bhavcopy patch for ${DATE} (${SYMS} symbols) [skip ci]"
          retry 3 git push origin HEAD:main

      - name: Trigger HF deploy with clean snapshot
        if: steps.patch.outputs.changed == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          retry() {
            local attempts="$1"
            shift
            local try=1
            until "$@"; do
              if [ "$try" -ge "$attempts" ]; then
                echo "command failed after ${try} attempts: $*" >&2
                return 1
              fi
              echo "retry ${try}/${attempts} failed: $*" >&2
              try=$((try + 1))
              sleep 5
            done
          }
          rm -rf /tmp/hf-deploy
          mkdir -p /tmp/hf-deploy
          rsync -a ./ /tmp/hf-deploy/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.venv' \
            --exclude 'backend/.venv' \
            --exclude 'frontend/node_modules' \
            --exclude 'test-results' \
            --exclude 'tmp' \
            --exclude 'backend/data/chart_cache' \
            --exclude 'backend/data/chart_cache_us' \
            --exclude 'backend/data/news_cache' \
            --exclude 'backend/data/free_snapshots.json' \
            --exclude 'backend/data/free_snapshots_us.json' \
            --exclude 'backend/data/free_snapshots.json.gz' \
            --exclude 'backend/data/free_snapshots_us.json.gz'
          cd /tmp/hf-deploy
          git init
          git checkout -b main
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add .
          git commit -m "Deploy bhavcopy snapshot ${GITHUB_SHA}"
          git remote add hf \
            "https://dharmmalik:${HF_TOKEN}@huggingface.co/spaces/dharmmalik/stock-scanner-backend"
          retry 3 git push hf main:main --force

      - name: Log skip
        if: steps.patch.outputs.changed == 'false'
        run: echo "Bhavcopy patch already current — no commit needed."
