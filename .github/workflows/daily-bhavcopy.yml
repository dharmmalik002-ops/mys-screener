name: Daily Bhavcopy Patch (BSE primary)

on:
  # BSE publishes the official equity bhavcopy CSV by ~4:00 PM IST and — unlike NSE —
  # is reachable from non-Indian IPs (GitHub Actions runners). The script tries BSE
  # first, then falls back to NSE (geo-blocked) and yfinance.
  #
  # IMPORTANT: GitHub Actions delays/drops scheduled runs whose minute lands on heavy
  # boundaries (:00, :15, :30, :45). Yesterday's runs were 2-3 hours late and today's
  # didn't fire at all. We use OFF-PEAK minutes plus self-healing from keep-alive.yml
  # (which dispatches this workflow if today's patch is still missing past 4:30 PM IST).
  schedule:
    - cron: "53 10 * * 1-5"  # 4:23 PM IST  (primary — BSE just published)
    - cron: "07 11 * * 1-5"  # 4:37 PM IST  (retry 1)
    - cron: "23 11 * * 1-5"  # 4:53 PM IST  (retry 2)
    - cron: "47 11 * * 1-5"  # 5:17 PM IST  (retry 3)
    - cron: "23 12 * * 1-5"  # 5:53 PM IST  (retry 4)
    - cron: "53 12 * * 1-5"  # 6:23 PM IST  (final retry)
  # Trigger when the workflow file itself is updated (so cron tweaks fire immediately).
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily-bhavcopy.yml"
  # Allow keep-alive.yml (and external schedulers) to fire this without WEB UI access.
  repository_dispatch:
    types: [bhavcopy-trigger]
  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bhavcopy:
    name: Fetch NSE EOD prices and commit patch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests yfinance pandas

      - name: Generate bhavcopy patch
        id: patch
        run: |
          set -euo pipefail
          python backend/scripts/generate_bhavcopy_patch.py
          # Capture whether the patch (or the price-band-changes store, which
          # the same script maintains) changed — new date vs already current.
          if git diff --quiet backend/data/bhavcopy_patch.json backend/data/price_band_changes.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh earnings metrics
        # Feeds the Positive Earnings scanner. Tolerate partial coverage
        # (yfinance has gaps for some smaller names) and never fail the
        # whole workflow when only this step trips.
        continue-on-error: true
        run: |
          set -euo pipefail
          python backend/scripts/compute_earnings_metrics.py --workers 6

      - name: Refresh volume history
        id: volhist
        # Feeds the Volume screener (true highest-volume-in-window detection).
        # Backfills ~1y of daily volume per symbol from yfinance into compact
        # windowed aggregates. Tolerate failures (yfinance gaps / rate limits)
        # without failing the whole workflow.
        continue-on-error: true
        run: |
          set -uo pipefail
          python backend/scripts/generate_volume_history.py || echo "volume history generation failed (non-fatal)"
          if git diff --quiet backend/data/volume_history.json 2>/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push if updated
        if: steps.patch.outputs.changed == 'true' || steps.volhist.outputs.changed == 'true'
        run: |
          set -euo pipefail
          retry() {
            local attempts="$1"
            shift
            local try=1
            until "$@"; do
              if [ "$try" -ge "$attempts" ]; then
                echo "command failed after ${try} attempts: $*" >&2
                return 1
              fi
              echo "retry ${try}/${attempts} failed: $*" >&2
              try=$((try + 1))
              sleep 5
            done
          }
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          # Stage the daily data artifacts (each only if present / changed).
          git add backend/data/bhavcopy_patch.json || true
          if [ -f backend/data/earnings_metrics.json ]; then
            git add backend/data/earnings_metrics.json || true
          fi
          if [ -f backend/data/volume_history.json ]; then
            git add backend/data/volume_history.json || true
          fi
          # NSE price-band revisions (chart band-change markers).
          if [ -f backend/data/price_band_changes.json ]; then
            git add backend/data/price_band_changes.json || true
          fi
          # XP market breadth score artifacts (history is tiny; the EMA-state
          # store is small and used only to compute the next day's MA inputs).
          if [ -f backend/data/xp_breadth_history.json ]; then
            git add backend/data/xp_breadth_history.json || true
          fi
          if [ -f backend/data/xp_ma_state.json ]; then
            git add backend/data/xp_ma_state.json || true
          fi
          if git diff --cached --quiet; then
            echo "Nothing staged to commit."
            exit 0
          fi
          DATE=$(python3 -c "import json; d=json.load(open('backend/data/bhavcopy_patch.json')); print(d['date'])")
          SOURCE=$(python3 -c "import json; d=json.load(open('backend/data/bhavcopy_patch.json')); print(str(d.get('source','NSE')).upper())")
          SYMS=$(python3 -c "import json; d=json.load(open('backend/data/bhavcopy_patch.json')); print(len(d['symbols']))")
          git commit -m "data: ${SOURCE} EOD bhavcopy patch for ${DATE} (${SYMS} symbols) + volume history [skip ci]"
          retry 3 git push origin HEAD:main

      - name: Trigger HF deploy with clean snapshot
        if: steps.patch.outputs.changed == 'true' || steps.volhist.outputs.changed == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          retry() {
            local attempts="$1"
            shift
            local try=1
            until "$@"; do
              if [ "$try" -ge "$attempts" ]; then
                echo "command failed after ${try} attempts: $*" >&2
                return 1
              fi
              echo "retry ${try}/${attempts} failed: $*" >&2
              try=$((try + 1))
              sleep 5
            done
          }
          rm -rf /tmp/hf-deploy
          mkdir -p /tmp/hf-deploy
          rsync -a ./ /tmp/hf-deploy/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.venv' \
            --exclude 'backend/.venv' \
            --exclude 'backend/venv' \
            --exclude 'frontend/node_modules' \
            --exclude 'frontend/public/api/free_snapshots.json' \
            --exclude 'frontend/public/api/free_snapshots_us.json' \
            --exclude 'test-results' \
            --exclude 'tmp' \
            --exclude 'backend/data/chart_cache' \
            --exclude 'backend/data/chart_cache_us' \
            --exclude 'backend/data/news_cache' \
            --exclude 'backend/data/free_snapshots.json' \
            --exclude 'backend/data/free_snapshots_us.json' \
            --exclude 'backend/data/free_snapshots.json.gz' \
            --exclude 'backend/data/free_snapshots_us.json.gz' \
            --exclude 'backend/data/xp_ma_state.json'
          cd /tmp/hf-deploy
          git init
          git checkout -b main
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add .
          git commit -m "Deploy bhavcopy snapshot ${GITHUB_SHA}"
          git remote add hf \
            "https://dharmmalik:${HF_TOKEN}@huggingface.co/spaces/dharmmalik/stock-scanner-backend"
          retry 3 git push hf main:main --force

      - name: Log skip
        if: steps.patch.outputs.changed == 'false' && steps.volhist.outputs.changed == 'false'
        run: echo "Bhavcopy patch and volume history already current — no commit needed."
