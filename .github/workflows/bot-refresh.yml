name: Trading Bot Refresh

on:
  # After the NSE close and after daily-bhavcopy has run. The bot reads its own
  # deep bar store rather than the bhavcopy, but running later keeps the
  # commits from colliding on the same files.
  schedule:
    - cron: "23 14 * * 1-5"   # 7:53 PM IST, Mon-Fri
  push:
    branches: [main]
    paths:
      - ".github/workflows/bot-refresh.yml"
      - "backend/app/services/bot/**"
      - "backend/scripts/build_deep_history.py"
      - "backend/scripts/run_bot_backtest.py"
      - "backend/scripts/generate_bot_signals.py"
      - "backend/scripts/run_paper_session.py"
  workflow_dispatch:
    inputs:
      rebuild_history:
        description: "Re-fetch every symbol's full history (~10 min) instead of topping up."
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: bot-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Rebuild the backtest and today's signals
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yfinance pandas numpy

      # `deep_history/` is ~100 MB and gitignored — it is the raw material, not
      # the product. Caching it turns the nightly run into a top-up of the last
      # few sessions instead of a full re-fetch of 5 million bars. Keyed on the
      # store's own format version so a format change rebuilds rather than
      # silently reading records the loader can no longer parse.
      - name: Restore deep history store
        id: histcache
        uses: actions/cache@v4
        with:
          path: backend/data/deep_history
          key: deep-history-v1-${{ hashFiles('backend/app/services/bot/history.py', 'backend/app/services/bot/context_series.py') }}-${{ github.run_id }}
          restore-keys: |
            deep-history-v1-${{ hashFiles('backend/app/services/bot/history.py', 'backend/app/services/bot/context_series.py') }}-

      - name: Build or top up the history store
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.rebuild_history }}" = "true" ]; then
            python backend/scripts/build_deep_history.py --refresh
          else
            # Without --refresh this skips every symbol already current, so a
            # warm cache costs a couple of minutes rather than ten.
            python backend/scripts/build_deep_history.py
          fi

      - name: Run the backtest and regenerate signals
        id: build
        run: |
          set -euo pipefail
          python backend/scripts/run_bot_backtest.py
          python backend/scripts/generate_bot_signals.py

          # Advance the paper book by one session. APP_STATE_DIR points at the
          # committed data directory on purpose: the runner is stateless and
          # the book IS the state, so it has to survive between runs. It is
          # small JSON, not a binary, so the Space's pre-receive hook (gotcha
          # 21) accepts it.
          #
          # `run_paper_session.py` is idempotent per session and catches up
          # any sessions a missed run left behind, so a failed or re-run
          # workflow cannot double-enter a position or strand the book.
          # Results dates feed `results_follow_through`; the rebuild re-derives
          # the live rules each January from trades closed before it.
          python backend/scripts/build_results_calendar.py --days 21 || \
            echo "results calendar refresh failed; yesterday's calendar stands"
          python backend/scripts/rules_walkforward.py --if-stale || \
            echo "yearly rebuild failed; last year's live rules stand"

          APP_STATE_DIR=backend/data python backend/scripts/run_paper_session.py || \
            echo "paper session failed; the study artifacts still commit"

          if git diff --quiet backend/data/bot_backtest.json backend/data/bot_signals.json \
                              backend/data/bot_paper.json backend/data/bot_paper_book.json \
                              backend/data/results_calendar.json backend/data/bot_live_params.json \
                              backend/data/bot_rules_walkforward.json \
                              backend/data/liquid_fund_nav.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Refuse to commit a degraded study
        if: steps.build.outputs.changed == 'true'
        # A throttled runner that fetched only a fraction of the universe would
        # otherwise commit a backtest built on a few hundred symbols, and the
        # Bot page would quietly start recommending from a study far weaker
        # than the one it claims. Same guard, and the same reasoning, as the
        # fund universe's commit gate.
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, sys
          from pathlib import Path

          study = json.loads(Path("backend/data/bot_backtest.json").read_text())
          coverage = study.get("coverage") or {}
          trades = coverage.get("trades_resolved") or 0
          symbols = coverage.get("symbols_with_trades") or 0
          sessions = coverage.get("sessions") or 0
          playbooks = study.get("playbooks") or []
          validated = study.get("validated") or []

          print(f"trades={trades} symbols={symbols} sessions={sessions} "
                f"playbooks={len(playbooks)} validated_cells={len(validated)}")

          problems = []
          if trades < 40_000:
              problems.append(f"only {trades} resolved trades (expected 90,000+)")
          if symbols < 800:
              problems.append(f"only {symbols} symbols produced trades (expected 1,300+)")
          if sessions < 3_000:
              problems.append(f"only {sessions} sessions replayed")
          if len(playbooks) < 6:
              problems.append(f"only {len(playbooks)} regime playbooks")
          if not study.get("current_regime"):
              problems.append("no current regime")
          if problems:
              print("REFUSING TO COMMIT: " + "; ".join(problems), file=sys.stderr)
              sys.exit(1)
          PY

      - name: Commit and push if updated
        if: steps.build.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add backend/data/bot_backtest.json backend/data/bot_signals.json
          git add backend/data/bot_paper.json backend/data/bot_paper_book.json || true
          git add backend/data/results_calendar.json backend/data/bot_live_params.json \
                  backend/data/bot_rules_walkforward.json || true
          git add backend/data/liquid_fund_nav.json || true
          git commit -m "chore(bot): refresh backtest and signals [skip ci]" || exit 0
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            echo "push attempt ${attempt} failed, retrying" >&2
            sleep 5
          done
          exit 1
