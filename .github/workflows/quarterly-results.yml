name: Quarterly Results (evening)

# The Results page: every company that declared results, on the page within
# about half an hour of the announcement, at any time of day. Every run reads
# BSE's "Result" filings since the last run, fetches the new quarters' figures
# and the minute each was declared (results_feed.json), then lists NSE's
# Integrated Filings since the last run and downloads the new ones
# (consolidated_results.json). Results are declared on Saturdays too, so it
# runs every day.
#
# Half-hourly runs are quick: today's filings only. Every three hours a run
# also re-lists the season (NSE's listing comes back incomplete at random,
# gotcha 163) — the script decides which from `full_listed_at`. A run that
# finds nothing new writes nothing, so there is no commit.
#
# The Space is not redeployed: it pulls both files every 10 minutes from 8 AM
# to midnight IST and whenever the page is opened (results_feed.py), and the
# commit carries [skip ci]. The 4:23 PM bhavcopy job owns quarterly_summary.json,
# and two jobs rewriting one file would collide on push.
on:
  schedule:
    - cron: "5,35 * * * *"   # every half hour (GitHub may start it late)
  # GitHub runs this repository's schedules late, sometimes by hours (gotcha
  # 143), so the cron line alone is not a half-hourly job. The Space's
  # watchdog (main.py::trigger_github_results_if_stale) sends this event at
  # :05 and :35 past each hour from 8 AM to midnight IST.
  repository_dispatch:
    types: [results-trigger]
  push:
    branches: [main]
    paths:
      - ".github/workflows/quarterly-results.yml"
  workflow_dispatch:
    inputs:
      days:
        description: "Look back this many days (0 = since the last run)"
        type: number
        default: 0

permissions:
  contents: write

concurrency:
  group: quarterly-results
  cancel-in-progress: false

jobs:
  results:
    name: Fetch, date and publish the day's results
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # The newest main, not the commit that triggered the run: a run that
          # queued behind another (concurrency group) would otherwise start
          # from data the previous run already replaced, redo its work, and
          # conflict on push (2026-10-11 20:10 IST: 30 minutes of downloads lost).
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # curl_cffi: BSE's Akamai refuses plain requests by TLS fingerprint (gotcha 159).
        run: pip install requests curl_cffi

      - name: Fetch the day's results from BSE
        id: standalone
        continue-on-error: true
        env:
          DAYS: ${{ github.event.inputs.days || '0' }}
          EVENT: ${{ github.event_name }}
        run: |
          set -uo pipefail
          # Scheduled and dispatched runs skip when a run read BSE in the last
          # 20 minutes (the cron and the Space can both fire); push and manual
          # runs always go.
          FLAGS=""
          if [ "$EVENT" = "schedule" ] || [ "$EVENT" = "repository_dispatch" ]; then FLAGS="--if-due"; fi
          if [ "$DAYS" != "0" ]; then FLAGS="$FLAGS --days $DAYS"; fi
          timeout 1200 python backend/scripts/update_results_feed.py $FLAGS

      # Consolidated figures (NSE Integrated Filing XBRL). A quick run stops
      # after ~7 minutes; a full one (every 3 hours) uses the whole budget.
      - name: Fetch consolidated results from NSE
        id: consolidated
        continue-on-error: true
        run: |
          set -uo pipefail
          timeout 2280 python backend/scripts/update_consolidated_results.py --max-seconds 1800

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add backend/data/results_feed.json backend/data/consolidated_results.json
          if git diff --cached --quiet; then
            echo "nothing new to publish"
            exit 0
          fi
          git commit -m "data: quarterly results through $(TZ=Asia/Kolkata date '+%F %H:%M') IST [skip ci]"
          # Other data jobs push around the same time; retry on top of whatever
          # landed first. Only this job writes these two files and runs are
          # serialised on the newest main, so the rebase does not conflict; if
          # it ever does, stop clearly rather than push a half-rebased tree.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 10))
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo "::error::results files changed on main during this run; nothing pushed"
              exit 1
            fi
          done
          echo "push failed after 5 attempts"
          exit 1

      # Whatever either step managed was committed above; a failed step still
      # marks the run red so it is seen.
      - name: Report a failed fetch
        if: steps.standalone.outcome == 'failure' || steps.consolidated.outcome == 'failure'
        run: |
          echo "standalone: ${{ steps.standalone.outcome }}  consolidated: ${{ steps.consolidated.outcome }}"
          exit 1
