name: zz earnings source probe (temporary)
on:
  push:
    branches: ["claude/great-hypatia-50gvy8"]
    paths: [".github/probe/**", ".github/workflows/zz-earnings-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests yfinance curl_cffi pandas
      - run: python .github/probe/probe.py
