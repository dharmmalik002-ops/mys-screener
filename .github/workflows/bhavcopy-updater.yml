name: Update Bhavcopy & Deploy

on:
  schedule:
    # Runs Mon-Fri at 11:00 UTC (~16:30 IST) to pick up official EOD files
    - cron: '0 11 * * 1-5'
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    env:
      HF_SPACE: ${{ secrets.HF_SPACE }}
      HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
      MAINTENANCE_TOKEN: ${{ secrets.MAINTENANCE_TRIGGER_TOKEN }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Generate bhavcopy patch
        run: python backend/scripts/generate_bhavcopy_patch.py

      - name: Commit bhavcopy patch if changed
        run: |
          set -e
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          if git diff --quiet --exit-code backend/data/bhavcopy_patch.json; then
            echo "No patch changes"
          else
            git add backend/data/bhavcopy_patch.json
            DATE=$(python - <<'PY'
import json
print(json.load(open('backend/data/bhavcopy_patch.json')).get('date'))
PY
)
            SYMS=$(python - <<'PY'
import json
print(len(json.load(open('backend/data/bhavcopy_patch.json')).get('symbols', {})))
PY
)
            git commit -m "data: NSE EOD bhavcopy patch for $DATE ($SYMS symbols) [skip ci]"
            git push origin HEAD:main
          fi

      - name: Prepare HF deploy snapshot and push
        env:
          HF_SPACE: ${{ secrets.HF_SPACE }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
        run: |
          set -e
          rm -rf /tmp/hf-deploy || true
          mkdir -p /tmp/hf-deploy
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.venv' \
            --exclude 'backend/.venv' \
            --exclude 'frontend/node_modules' \
            --exclude 'test-results' \
            --exclude 'tmp' \
            --exclude 'backend/data/chart_cache' \
            --exclude 'backend/data/chart_cache_us' \
            --exclude 'backend/data/news_cache' \
            --exclude 'backend/data/free_snapshots.json' \
            --exclude 'backend/data/free_snapshots_us.json' \
            --exclude 'backend/data/free_snapshots.json.gz' \
            --exclude 'backend/data/free_snapshots_us.json.gz' \
            ./ /tmp/hf-deploy/
          cd /tmp/hf-deploy
          git init
          git checkout -b main
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add .
          if git diff --cached --quiet; then
            echo "No HF deploy changes"
          else
            git commit -m "Deploy bhavcopy snapshot $GITHUB_SHA"
            # push using token-authenticated URL
            git remote add hf "https://x-access-token:${HUGGINGFACE_TOKEN}@huggingface.co/spaces/${HF_SPACE}" || true
            git push hf main:main --force
          fi

      - name: Poll HF health and call maintenance endpoint
        env:
          HF_SPACE: ${{ secrets.HF_SPACE }}
          MAINTENANCE_TOKEN: ${{ secrets.MAINTENANCE_TRIGGER_TOKEN }}
        run: |
          set -e
          if [ -z "${HF_SPACE}" ]; then echo "HF_SPACE not set - skipping health check"; exit 0; fi
          HF_SPACE_NAME="${HF_SPACE//\//-}"
          HEALTH_URL="https://${HF_SPACE_NAME}.hf.space/api/health"
          MAINT_URL="https://${HF_SPACE_NAME}.hf.space/api/maintenance/eod-refresh"
          echo "Polling ${HEALTH_URL}"
          STATUS=""
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' "${HEALTH_URL}" ) || true
            echo "Attempt $i: $STATUS"
            if [ "${STATUS}" = "200" ]; then
              echo "Space healthy"
              break
            fi
            sleep 10
          done
          if [ "${STATUS}" = "200" ]; then
            echo "Calling maintenance endpoint to apply patch..."
            curl -sSf -X POST "${MAINT_URL}" -H "x-maintenance-token: ${MAINTENANCE_TOKEN}" -H "Content-Type: application/json" -d '{}'
          else
            echo "HF Space not healthy after polling; skipping maintenance call"
          fi
