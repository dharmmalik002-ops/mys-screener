name: Look-alike Daily Picks

# Reviews open look-alike picks, makes today's, and publishes them — on a
# GitHub runner, so nothing depends on the workstation being switched on.
# The Space is not redeployed: it pulls the two public files itself within the
# hour (backend/app/api/lookalike_routes.py), and the commit carries [skip ci].
on:
  schedule:
    - cron: "30 12 * * 1-5"   # 6:00 PM IST, Mon-Fri
  # GitHub runs this repository's schedules HOURS late (the 7:53 PM bot job
  # routinely starts after midnight), so the cron line alone is not a 6 PM
  # job. The Space's watchdog (main.py::trigger_github_lookalike_if_stale)
  # sends this event every 30 minutes from 18:05 IST until the day's picks
  # are out, and keep-alive.yml does the same as a fallback.
  repository_dispatch:
    types: [lookalike-trigger]
  push:
    branches: [main]
    paths:
      - ".github/workflows/lookalike-daily.yml"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if today's picks are already published"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: lookalike-daily
  cancel-in-progress: false

jobs:
  picks:
    name: Pick, review and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Several triggers fire each evening; only the first one that finds the
      # day's picks missing does the work. "Done" means published today at or
      # after 18:00 IST (same test as main.py::lookalike_ran_today), so a
      # market holiday is done after one run rather than re-run all evening.
      - name: Is today's run still due?
        id: due
        env:
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timedelta, timezone
          ist = timezone(timedelta(hours=5, minutes=30))
          now = datetime.now(ist)
          try:
              stamp = json.load(open("backend/data/lookalike_picks.json")).get("generated_at", "")
              done = datetime.fromisoformat(stamp.replace("Z", "+00:00")).astimezone(ist)
              ran = done.date() == now.date() and done.hour >= 18
          except Exception:
              ran = False
          run = os.environ["FORCE"] == "true" or (not ran and now.weekday() < 5 and now.hour >= 18)
          print(f"now {now:%Y-%m-%d %H:%M} IST · last published {stamp or 'never'} · run={run}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"run={'true' if run else 'false'}\n")
          PY

      - name: Set up Python
        if: steps.due.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The runner is Python 3.11 and development is on 3.12+; a syntax that only
      # newer Python accepts stopped the first evening's run at import. Fail in
      # seconds, before the slow install, rather than after it.
      - name: Check the scripts load on this Python
        if: steps.due.outputs.run == 'true'
        run: |
          python -m py_compile backend/app/services/lookalike/*.py backend/app/api/lookalike_routes.py \
            backend/scripts/run_lookalike_day.py backend/scripts/build_deep_history.py

      - name: Install dependencies
        if: steps.due.outputs.run == 'true'
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install transformers pillow yfinance pandas numpy requests

      # The same store and the same key as bot-refresh.yml, so the two jobs
      # keep one cache warm between them and each run is a top-up, not a
      # 5-million-bar re-fetch.
      - name: Restore deep history store
        if: steps.due.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: backend/data/deep_history
          key: deep-history-v1-${{ hashFiles('backend/app/services/bot/history.py', 'backend/app/services/bot/context_series.py') }}-${{ github.run_id }}
          restore-keys: |
            deep-history-v1-${{ hashFiles('backend/app/services/bot/history.py', 'backend/app/services/bot/context_series.py') }}-

      - name: Restore the image model
        if: steps.due.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-dinov2-small-v1

      - name: Top up prices
        if: steps.due.outputs.run == 'true'
        run: python backend/scripts/build_deep_history.py

      # The 👍/👎 votes live on the Space (Postgres or its disk). Copy them here
      # so tonight's run can learn from them, and commit the copy so a Space
      # restart without a database can restore them. A failed fetch keeps the
      # last committed copy rather than wiping it.
      - name: Fetch feedback votes
        if: steps.due.outputs.run == 'true'
        run: |
          set -uo pipefail
          OUT=backend/data/lookalike_feedback_votes.json
          if curl -s -f --max-time 60 "https://dharmmalik-stock-scanner-backend.hf.space/api/lookalikes/feedback" -o /tmp/votes.json \
             && python3 -c "import json; d=json.load(open('/tmp/votes.json')); assert isinstance(d.get('votes'), list)"; then
            python3 - <<'PY'
          import json
          new = json.load(open("/tmp/votes.json"))
          try:
              old = json.load(open("backend/data/lookalike_feedback_votes.json"))
          except Exception:
              old = {"votes": []}
          # Never shrink silently: keep committed votes the Space no longer has.
          merged = {v["id"]: v for v in old.get("votes", []) if "id" in v}
          merged.update({v["id"]: v for v in new["votes"] if "id" in v})
          from datetime import datetime, timezone
          json.dump({"generated_at": datetime.now(timezone.utc).isoformat(timespec="seconds"),
                     "votes": sorted(merged.values(), key=lambda v: v["id"])},
                    open("backend/data/lookalike_feedback_votes.json", "w"), indent=1)
          print("votes:", len(merged))
          PY
          else
            echo "could not fetch votes; keeping the committed copy"
          fi

      - name: Review open picks, pick today, re-export
        if: steps.due.outputs.run == 'true'
        working-directory: backend
        run: python scripts/run_lookalike_day.py

      # A throttled runner that fetched a fraction of the market would publish
      # a day picked from a few hundred stocks as if it were the whole market.
      - name: Refuse to publish a degraded scan
        if: steps.due.outputs.run == 'true'
        working-directory: backend
        run: |
          python - <<'PY'
          import json, sys
          scanned = json.load(open("data/lookalikes.json")).get("scanned", 0)
          print("charts scanned:", scanned)
          sys.exit(0 if scanned >= 1000 else "too few charts scanned — not publishing")
          PY

      - name: Commit and push
        if: steps.due.outputs.run == 'true'
        run: |
          set -euo pipefail
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add backend/data/lookalikes.json backend/data/lookalike_picks.json backend/data/lookalike_refs.json backend/data/lookalike_refs \
            backend/data/lookalike_index.json backend/data/lookalike_days backend/data/lookalike_state \
            backend/data/lookalike_feedback_votes.json backend/data/lookalike_history.json backend/data/lookalike_history
          if git diff --cached --quiet; then
            echo "nothing new to publish"
            exit 0
          fi
          git commit -m "data: look-alike picks for $(TZ=Asia/Kolkata date +%F) [skip ci]"
          # The bhavcopy and fund jobs push around the same time; retry on top
          # of whatever landed first. Only our own files are in this commit.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 10))
            git pull --rebase origin main
          done
          echo "push failed after 5 attempts"
          exit 1
